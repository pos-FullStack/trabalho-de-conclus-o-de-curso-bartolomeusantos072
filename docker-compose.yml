services:
  db001:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
      POSTGRES_DB: cardapio_escolar
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio_escolar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app001:
    build: .
    restart: unless-stopped
    depends_on:
      db001:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cardapio:cardapio@db001:5432/cardapio_escolar
      JWT_SECRET: troque-este-segredo-em-producao
      NEXT_PUBLIC_IMGBB_API_KEY: ${IMGBB_API_KEY:-}
    ports:
      - "3000:3000"
    command: sh -c "until npx prisma migrate deploy; do echo 'Banco ainda não está pronto, tentando novamente em 3s...'; sleep 3; done; npm start"

volumes:
  db_data:
